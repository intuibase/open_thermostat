name: PlatformIO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            .pio/platforms
            .pio/libdeps-arduino3
          key: ${{ runner.os }}-py314-pio62-${{ hashFiles('platformio.ini', 'tools/platformio_*.py') }}
          restore-keys: |
            ${{ runner.os }}-py314-pio62-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PlatformIO and build dependencies
        run: python -m pip install "platformio==6.2.0" "intelhex==2.3.0"

      - name: Run native tests
        run: pio test -e native --verbose

      - name: Build ESP32 and ESP32-S3 firmware
        run: pio run -e esp32dev -e esp32s3
